---
# Stage 3: replaces the running container on the Docker host with one built
# from the latest image on Docker Hub.
# (Named deploy_regapp.yml in Stage 3; renamed in Stage 4.)
- hosts: dockerhost

  tasks:
  - name: stop existing container
    command: docker stop regapp-server
    ignore_errors: yes

  - name: remove the container
    command: docker rm regapp-server
    ignore_errors: yes

  - name: remove image
    command: docker rmi corporate2/regapp:latest
    ignore_errors: yes

  - name: create container
    command: docker run -d --name regapp-server -p 8082:8080 corporate2/regapp:latest
