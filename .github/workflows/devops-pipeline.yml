# Recreates the AWS pipeline on GitHub-hosted runners:
# Maven build -> Docker image -> Kubernetes deployment (kind), with the same
# manifests that ran on EKS, plus checks on the Ansible playbooks.
name: DevOps CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "AWS DevOps Project/**"
      - ".github/workflows/devops-pipeline.yml"
  pull_request:
    paths:
      - "AWS DevOps Project/**"
      - ".github/workflows/devops-pipeline.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: AWS DevOps Project

jobs:
  build:
    name: Build WAR (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: AWS DevOps Project/app/**/pom.xml
      - run: mvn -B package
        working-directory: AWS DevOps Project/app
      - uses: actions/upload-artifact@v4
        with:
          name: webapp-war
          path: AWS DevOps Project/app/webapp/target/webapp.war

  validate-config:
    name: Validate Ansible + Kubernetes config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ansible syntax check
        run: |
          pipx install ansible-core
          for playbook in ansible/*.yml; do
            ansible-playbook -i ansible/hosts --syntax-check "$playbook"
          done
      - name: Kubernetes schema validation
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary kubernetes/regapp-deployment.yml kubernetes/regapp-service.yml

  deploy:
    name: Docker image + Kubernetes deploy
    needs: [build, validate-config]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t regapp:local app

      - name: Smoke test container
        run: |
          docker run -d --name regapp -p 8087:8080 regapp:local
          for i in $(seq 1 30); do
            curl -sf http://localhost:8087/webapp/ > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8087/webapp/ | grep "New User Registration"
          docker rm -f regapp

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: regapp

      - name: Deploy to Kubernetes
        run: |
          kind load docker-image regapp:local --name regapp
          kubectl apply -k local-cluster
          kubectl rollout status deployment/corporate2-regapp --timeout=180s
          kubectl get all

      - name: Smoke test service
        run: |
          kubectl port-forward service/corporate2-service 8080:8080 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/webapp/ > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8080/webapp/ | grep "New User Registration"

      - name: Rolling update (kubectl rollout restart, as kube_deploy.yml does)
        run: |
          kubectl rollout restart deployment/corporate2-regapp
          kubectl rollout status deployment/corporate2-regapp --timeout=180s
